{% extends "base.html" %}


{% block content %}


<section class="dashboard-page">



    <div class="dashboard-header">


        <h1>
            Update Skill
        </h1>


        <p>
            Edit your technical skill information.
        </p>


    </div>





    <section class="dashboard-form-card">



        <form method="post">


            {% csrf_token %}



            <div class="dashboard-form">


                {{ form.as_p }}


            </div>





            <div class="dashboard-form-actions">



                <button type="submit"
                        class="dashboard-primary-btn">

                    Update Skill

                </button>





                <a href="{% url 'dashboard_skills' %}"
                   class="dashboard-cancel-btn">

                    Cancel

                </a>



            </div>



        </form>



    </section>




</section>



{% endblock %}
