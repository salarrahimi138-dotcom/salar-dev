{% extends "base.html" %}

{% block content %}

<h1>Delete Blog/Post</h1>

<p>
    Are you sure you want to delete:
    <strong>{{ post.title }}</strong>?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Delete
    </button>

</form>

<br>

<a href="{% url 'dashboard_posts' %}">
    Cancel
</a>

{% endblock %}
