{% extends "base.html" %}


{% block content %}



<section class="dashboard-page">





    <div class="dashboard-header">


        <h1>
            Update Blog Post
        </h1>


        <p>
            Edit your article information and update your content.
        </p>


    </div>







    <section class="dashboard-form-card">





        <form method="post" enctype="multipart/form-data">



            {% csrf_token %}







            <div class="dashboard-form">


                {{ form.as_p }}


            </div>







            <div class="dashboard-form-actions">





                <button type="submit"
                        class="dashboard-primary-btn">


                    Update Blog Post


                </button>







                <a href="{% url 'dashboard_posts' %}"
                   class="dashboard-cancel-btn">


                    Back to Blog Posts


                </a>





            </div>





        </form>






    </section>






</section>





{% endblock %}
