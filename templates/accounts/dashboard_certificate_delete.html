{% extends "base.html" %}

{% block content %}

<h1>Delete Certificate</h1>

<p>
    Are you sure you want to delete:
    <strong>{{ certificate.title }}</strong>?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Delete
    </button>

</form>

<br>

<a href="{% url 'dashboard_certificates' %}">
    Cancel
</a>

{% endblock %}
