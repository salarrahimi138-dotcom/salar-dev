{% extends "base.html" %}

{% block content %}


<section class="dashboard-page">


    <div class="dashboard-header">

        <h1>
            Delete Project
        </h1>


        <p>
            Are you sure you want to delete this project?
        </p>

    </div>





    <section class="dashboard-form-card">


        <h2>
            {{ project.title }}
        </h2>


        <p>
            This action cannot be undone.
        </p>





        <form method="post">

            {% csrf_token %}



            <div class="dashboard-form-actions">



                <button type="submit" class="button">


                    <!-- Trash Lid -->

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 69 14"
                        class="svgIcon bin-top">

                        <path
                        d="M20.823 2.6L20 4.2C19.8 4.5 19.5 4.7 19.1 4.7H5C2.2 4.7 0 6.8 0 9.5C0 12.1 2.2 14.2 5 14.2H64C66.8 14.2 69 12.1 69 9.5C69 6.8 66.8 4.7 64 4.7H50C49.5 4.7 49.2 4.5 49 4.2L48.2 2.6C47.3 1 45.6 0 43.7 0H25.2C23.3 0 21.6 1 20.8 2.6Z"/>

                    </svg>





                    <!-- Trash Body -->

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 69 57"
                        class="svgIcon bin-bottom">


                        <path
                        d="M7 0H62L58 50C57.7 54 55 57 51 57H18C14 57 11.3 54 11 50L7 0Z"/>


                    </svg>



                </button>





                <a href="{% url 'dashboard_projects' %}"
                   class="dashboard-cancel-btn">

                    Cancel

                </a>



            </div>



        </form>



    </section>



</section>


{% endblock %}
