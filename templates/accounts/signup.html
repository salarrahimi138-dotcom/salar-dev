{% extends "base.html" %}


{% block content %}


<section class="auth-page">


    <div class="auth-card">


        <div class="auth-header">


            <h1>
                Create Account
            </h1>


            <p>
                Join Salar.dev community
            </p>


        </div>




        <form method="post">


            {% csrf_token %}



            <div class="auth-form">


                {{ form.as_p }}


            </div>





            <button type="submit" class="auth-button">


                Sign Up


            </button>




        </form>





        <div class="auth-footer">


            <p>


                Already have an account?


                <a href="{% url 'login' %}">

                    Login

                </a>


            </p>


        </div>




    </div>



</section>


{% endblock %}
