{% extends "base.html" %}


{% block content %}


<section class="auth-page">


    <div class="auth-card">


        <div class="auth-header">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your Salar.dev account
            </p>

        </div>



        <form method="post">


            {% csrf_token %}


            <div class="auth-form">


                {{ form.as_p }}


            </div>




            <button type="submit" class="auth-button">

                Login

            </button>



        </form>



        <div class="auth-footer">


            <p>

                Don't have an account?

                <a href="{% url 'signup' %}">
                    Sign Up
                </a>

            </p>


        </div>


    </div>



</section>


{% endblock %}
