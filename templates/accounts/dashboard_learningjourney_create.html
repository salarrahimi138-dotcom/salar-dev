{% extends "base.html" %}


{% block content %}



<section class="dashboard-page">





    <div class="dashboard-header">


        <h1>
            Add New Learning Journey
        </h1>


        <p>
            Add a new learning path and track your progress.
        </p>


    </div>







    <section class="dashboard-form-card">





        <form method="post">



            {% csrf_token %}







            <div class="dashboard-form">


                {{ form.as_p }}


            </div>







            <div class="dashboard-form-actions">





                <button type="submit"
                        class="dashboard-primary-btn">


                    Save Learning Journey


                </button>







                <a href="{% url 'dashboard_learningjourneys' %}"
                   class="dashboard-cancel-btn">


                    Back to Learning Journey


                </a>





            </div>





        </form>






    </section>






</section>





{% endblock %}
