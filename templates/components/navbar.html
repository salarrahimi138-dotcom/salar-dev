{% load static %}

<nav class="sns-navbar">

    <div class="sns-logo">
        <a href="{% url 'home' %}" class="logo-text">
            Salar<span>.dev</span>
        </a>
    </div>


    <div class="sns-nav-pill">

        <a href="{% url 'home' %}"
           class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
            Home
        </a>

        <a href="{% url 'about' %}"
           class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">
            About
        </a>

        <a href="{% url 'projects' %}"
           class="{% if request.resolver_match.url_name == 'projects' %}active{% endif %}">
            Projects
        </a>

        <a href="{% url 'skills' %}"
           class="{% if request.resolver_match.url_name == 'skills' %}active{% endif %}">
            Skills
        </a>

        <a href="{% url 'learning' %}"
           class="{% if request.resolver_match.url_name == 'learning' %}active{% endif %}">
            Learning
        </a>

        <a href="{% url 'certificate' %}"
           class="{% if request.resolver_match.url_name == 'certificate' %}active{% endif %}">
            Certificates
        </a>

        <a href="{% url 'blog' %}"
           class="{% if request.resolver_match.url_name == 'blog' %}active{% endif %}">
            Blog
        </a>

    </div>


    <div class="sns-actions">

        <label class="theme-switch">

            <input
                type="checkbox"
                class="theme-switch__checkbox"
                id="theme-toggle"
                aria-label="Toggle theme"
                checked>

            <div class="theme-switch__container">

                <div class="theme-switch__clouds"></div>

                <svg class="theme-switch__stars-container" viewBox="0 0 64 32">
                    <path d="M8 3Q8 8 13 8Q8 8 8 13Q8 8 3 8Q8 8 8 3Z"/>
                    <path d="M22 19Q22 22 25 22Q22 22 22 25Q22 22 19 22Q22 22 22 19Z"/>
                    <path d="M36 4Q36 8 40 8Q36 8 36 12Q36 8 32 8Q36 8 36 4Z"/>
                </svg>

                <div class="theme-switch__circle-container">
                    <div class="theme-switch__sun-moon-container">
                        <div class="theme-switch__moon">
                            <div class="theme-switch__spot"></div>
                            <div class="theme-switch__spot"></div>
                            <div class="theme-switch__spot"></div>
                        </div>
                    </div>
                </div>

            </div>

        </label>


        <form class="sns-search" action="{% url 'search' %}" method="GET" role="search">

            <input
                type="checkbox"
                class="sns-search__toggle"
                aria-label="Toggle search">

            <div class="sns-search__box">

                <div class="sns-search__icon-wrap">
                    <svg
                        class="sns-search__icon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
                    </svg>
                </div>

                <input
                    type="text"
                    name="q"
                    class="sns-search__input"
                    placeholder="Search..."
                    autocomplete="off">

            </div>

        </form>


        {% if request.user.is_authenticated %}

            <a href="{% url 'profile' %}" class="navbar-profile">
                {% if request.user.profile.image %}
                    <img src="{{ request.user.profile.image.url }}" alt="Profile Image">
                {% else %}
                    <span>{{ request.user.username|first|upper }}</span>
                {% endif %}
            </a>

            <a href="{% url 'dashboard' %}">Dashboard</a>

            <a href="{% url 'logout' %}">Logout</a>

        {% else %}

            <a href="{% url 'login' %}">Login</a>

            <a href="{% url 'signup' %}">Signup</a>

        {% endif %}

    </div>

</nav>
