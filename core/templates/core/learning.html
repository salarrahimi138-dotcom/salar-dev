{% extends "base.html" %}

{% block content %}

<h1>Learning Journey</h1>
<div>
{% for item in learning %}


    <h3>{{ item.title }}</h3>
    <p>Skill Name:{{ item.skill.name }}</p>
    <p>Status:{{ item.status }} </p>
    <p>Provider:{{ item.provider }} </p>
    <p>{{ item.route_title }}</p>
    <p>{{ item.explanation }}</p>

{% endfor %}

</div>

{% endblock %}
